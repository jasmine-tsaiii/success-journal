name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 固定版本：ubuntu-latest 換成 26.04 後，Playwright 1.56 無法安裝 Chromium
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Install Playwright Chromium
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
